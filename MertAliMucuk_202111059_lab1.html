<!--Hocam Login yazısına bastığınız zaman dönüş ve background animasyonlarımı gözlemliyceksiniz bilgilendirmek istedim-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mcqueen Login</title>
    <style>
      /* AI PROMPT1:Kendi indirdiğim bir font yazısını nasıl koduma entegre edebilirim ? */
      @font-face {
        font-family: "Unreal";
        src: url("Fonts/Unreal.ttf") format("truetype");
      }
      /*AI PROMPT1 SON*/
      .damali-metin {
        font-family: "Unreal", sans-serif;
        font-size: 22px;
        color: red;
        text-shadow: 10px 10px 10px red;
        text-transform: uppercase;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 142vh;
        background: url("https://i.pinimg.com/736x/97/1e/5a/971e5a4600d5c749668194840c1154fa.jpg")
          no-repeat center center fixed;
        background-size: cover;
        overflow: hidden;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-container {
        width: 150px;
        height: 150px;
        background: black;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .small-logo {
        width: 40px;
        height: 30px;
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
      }

      .trophy {
        position: relative;
        width: 80px;
        height: 120px;
      }

      .cup {
        width: 80px;
        height: 60px;
        background: gold;
        border-radius: 40px 40px 0 0;
        position: absolute;
        top: 0;
      }

      .handles {
        position: absolute;
        width: 110px;
        height: 50px;
        border: 8px solid gold;
        border-radius: 50%;
        top: 5px;
        left: -20px;
      }

      .stem {
        width: 30px;
        height: 30px;
        background: gold;
        position: absolute;
        top: 60px;
        left: 25px;
      }

      .base {
        width: 50px;
        height: 15px;
        background: darkgoldenrod;
        position: absolute;
        top: 90px;
        left: 15px;
      }

      .small-logo .handles {
        width: 60px;
        height: 30px;
        border-width: 5px;
        left: 0px;
      }

      .small-logo .cup {
        width: 50px;
        height: 30px;
        border-radius: 25px 25px 0 0;
        left: 10px;
        top: 40;
      }

      .small-logo .stem {
        width: 15px;
        height: 30px;
        left: 28px;
        top: 30px;
      }

      .small-logo .base {
        width: 30px;
        height: 10px;
        left: 20px;
        top: 50px;
      }

      .login-box {
        position: relative;
        padding: 10px;
        background: white;
        border-radius: 20px;
        border: 6px solid red;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        margin-top: 20px;
        left: 5px;
        text-align: center;
      }

      .login-box img.top-right {
        width: 100px;
        height: auto;
        position: absolute;
        top: 150px;
        right: 100px;
        border-radius: 10px;
        border: 2px solid red;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      }

      .login-box img.bottom-left {
        width: 120px;
        height: auto;
        position: absolute;
        bottom: 80px;
        left: 90px;
        border-radius: 10px;
        border: 2px solid red;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      }

      input {
        width: 250px;
        padding: 10px;
        margin: 10px 0;
        border: 2px solid #ff0000;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: all 0.3s ease-in-out;
        box-shadow: 2px 2px 10px rgba(255, 0, 0, 0.3);
        font-family: "Unreal", sans-serif;
      }

      input:focus {
        border-color: #b30000;
        box-shadow: 2px 2px 15px rgba(255, 0, 0, 0.5);
      }

      input::placeholder {
        color: red;
        font-size: 18px;
        font-family: "Unreal", sans-serif;
        text-shadow: 10px 5px 10px rgba(255, 0, 0, 0.7);
        transition: all 0.3s ease;
      }

      button {
        padding: 10px 20px;
        border: none;
        background-color: red;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        font-size: 16px;
        font-family: "Unreal", sans-serif; /* Unreal fontunu kullan */
      }

      h2 {
        color: red;
        font-size: 22px;
      }
      /* AI PROMPT 2:Kendi tasarladıgım logonun dönüş hareketini nasıl sağlarım ? */
      .rotate {
        animation: rotate 2s linear 1;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      /*AI Prompt2 son */
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <div class="logo trophy" id="main-logo">
          <div class="handles"></div>
          <div class="cup"></div>
          <div class="stem"></div>
          <div class="base"></div>
        </div>
      </div>
      <div class="login-box">
        <img
          class="top-right"
          src="https://i.pinimg.com/736x/bb/8b/e8/bb8be8b1ddcbb716213bcce07e8c09ed.jpg"
          alt="McQueen Image"
        />
        <img
          class="bottom-left"
          src="https://i.pinimg.com/736x/9b/77/29/9b7729a5ca4bd7de29455842a63b6883.jpg"
          alt="McQueen Image"
        />
        <p class="damali-metin">
          🏁 WELCOME TO MCQUEEN KACOVV CLUB 🏁<br />
          🔥 Only the fastest can enter!🔥<br />
        </p>
        <div class="small-logo trophy" id="small-logo">
          <div class="handles"></div>
          <div class="cup"></div>
          <div class="stem"></div>
          <div class="base"></div>
        </div>
        <input type="text" placeholder="Route66 Username" />
        <input type="password" placeholder="Route66 Password" />
        <button onclick="startAnimation()">Login</button>
      </div>
    </div>
    <!--AI PROMPT 3: JavaScriptle animasyon başlangıçlarımı ve gif geçişlerimi nasıl sağlayabilirim ?-->
    <script>
      function startAnimation() {
        document.getElementById("main-logo").classList.add("rotate");
        document.getElementById("small-logo").classList.add("rotate");
        document.body.style.backgroundImage =
          'url("https://i.pinimg.com/originals/2b/ad/fa/2badfaa932f37114daa074a85a75a847.gif")';
      }
    </script>
    <!--AI PROMPT 3 SON-->
  </body>
</html>
<!--Hocam kullandığım AI promptları birebir almak yerine kendi koduma entegre ettim öğrenip şeffaflık amaçlı prompt notlarını bıraktım-->
